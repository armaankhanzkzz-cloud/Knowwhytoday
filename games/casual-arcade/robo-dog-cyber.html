<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Robo Dog Sky Adventure</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; font-family:Arial,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; width:min(100vw, 430px); height:100vh; max-height:760px; }
  canvas { width:100%; height:100%; display:block; background:#70c9ef; touch-action:none; }
  #hint {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; color:white; text-align:center; font-weight:700;
    text-shadow:0 2px 4px #345;
  }
  #hint span { background:#0008; padding:12px 18px; border-radius:14px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hint"><span>Robo Dog Sky Adventure<br>Tap / Click / Space<br>to fly</span></div>
</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hint = document.getElementById("hint");

let W, H, dpr;
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  const r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize); resize();

let bird, skyGates, score, best = Number(localStorage.skyBirdBest || 0);
let running = false, gameOver = false, last = 0, spawnTimer = 0;
let obstacles = [];
let enemyBirds = [];
let obstacleStage = 0;
let worldStage = 1;
let weather = 'clear';
let relics = [];
let currentSpeed = 185;
const gravity = 1350, flap = -430, gateSpeed = 185, gap = 155;

function reset(){
  bird = {x: W*0.28, y:H*0.45, vy:0, r:16, rot:0};
  skyGates=[]; obstacles=[]; enemyBirds=[]; relics=[]; score=0; obstacleStage=0; currentSpeed=185; worldStage=1; weather='clear'; running=false; gameOver=false; spawnTimer=0;
  hint.style.display="flex";
}
function start(){
  if(gameOver) reset();
  running=true; gameOver=false; hint.style.display="none";
  bird.vy=flap;
}
function action(){
  if(!running){ start(); return; }
  bird.vy=flap;
}
function addSkyGate(){
  const minTop=70, maxTop=H-130-gap;
  const top=minTop+Math.random()*Math.max(1,maxTop-minTop);
  skyGates.push({x:W+35, top, passed:false});
}
function addObstacle(){
  const type = obstacleStage;
  if(type===1){
    obstacles.push({x:W+40,y:H-70,w:55,h:55,type:"rock"});
  }
  if(type===2){
    obstacles.push({x:W+40,y:90+Math.random()*180,w:60,h:45,type:"cloud"});
  }
  if(type>=3){
    obstacles.push({x:W+40,y:H-120,w:75,h:35,type:"barrier"});
  }
}

function addEnemyBird(){
  enemyBirds.push({
    x: W + 60,
    y: 80 + Math.random() * (H - 220),
    w: 34,
    h: 28,
    speed: currentSpeed + 40,
    wing: 0
  });
}

function hitEnemyBird(b){
  return bird.x + bird.r > b.x &&
         bird.x - bird.r < b.x + b.w &&
         bird.y + bird.r > b.y &&
         bird.y - bird.r < b.y + b.h;
}

function hitObstacle(o){
  return bird.x+bird.r>o.x &&
         bird.x-bird.r<o.x+o.w &&
         bird.y+bird.r>o.y &&
         bird.y-bird.r<o.y+o.h;
}

function hitSkyGate(p){
  const bx=bird.x, by=bird.y, r=bird.r;
  const withinX = bx+r > p.x && bx-r < p.x+58;
  if(!withinX) return false;
  return by-r < p.top || by+r > p.top+gap;
}
function end(){
  running=false; gameOver=true;
  best=Math.max(best,score); localStorage.skyBirdBest=best;
  hint.innerHTML="<span>Game Over<br>Tap to try again</span>";
  hint.style.display="flex";
}
function updateWorld(){
  if(score>=200){
    worldStage=2;
    weather='storm';
  }
  if(score>=400){
    worldStage=3;
    weather='night';
  }
}

function update(dt){
  if(!running) return;
  updateWorld();
  bird.vy += gravity*dt;
  bird.y += bird.vy*dt;
  bird.rot = Math.max(-0.45, Math.min(1.15, bird.vy/550));
  spawnTimer += dt;
  if(spawnTimer>1.55){ 
    spawnTimer=0; 
    addSkyGate();
    if(score>=30 && Math.random()<0.45) addObstacle();

    if(score>=100 && Math.random()<0.18){
      addEnemyBird();
    }

    if(score>=200 && Math.random()<0.15){
      relics.push({x:W+50,y:80+Math.random()*(H-200),r:22});
    }
  }
  for(const p of skyGates){
    p.x -= currentSpeed*dt;
    if(!p.passed && p.x+58 < bird.x){
      p.passed=true; score++;

      if(score>=30 && score%30===0 && obstacleStage<3){
        obstacleStage++;
      }

      if(score>=50){
        currentSpeed = 220 + Math.floor(score/50)*20;
      }
    }
    if(hitSkyGate(p)) end();
  }
  skyGates=skyGates.filter(p=>p.x>-80);

  for(const o of obstacles){
    o.x -= currentSpeed*dt;
    if(hitObstacle(o)) end();
  }
  obstacles=obstacles.filter(o=>o.x>-100);

  for(const b of enemyBirds){
    b.x -= b.speed * dt;
    b.wing += dt * 10;
    if(hitEnemyBird(b)) end();
  }

  enemyBirds = enemyBirds.filter(b=>b.x>-100);

  for(const r of relics){
    r.x -= currentSpeed*dt;
    if(bird.x+r.r>r.x && bird.x-r.r<r.x+r.r &&
       bird.y+r.r>r.y && bird.y-r.r<r.y+r.r){
       end();
    }
  }
  relics = relics.filter(r=>r.x>-100);
  if(bird.y-bird.r<0 || bird.y+bird.r>H) end();
}
function cloud(x,y,s){
  ctx.fillStyle="#fff8";
  ctx.beginPath();
  ctx.arc(x,y,20*s,0,Math.PI*2);
  ctx.arc(x+25*s,y-10*s,27*s,0,Math.PI*2);
  ctx.arc(x+55*s,y,20*s,0,Math.PI*2);
  ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // sky
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,
    worldStage===3 ? "#101b2d" : worldStage===2 ? "#667788" : "#63c8f2");
  g.addColorStop(1,
    worldStage===3 ? "#25324a" : worldStage===2 ? "#b8c2cc" : "#c9f2ff");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  if(weather==='storm'){
    ctx.fillStyle="#ffffff55";
    for(let i=0;i<12;i++){
      ctx.fillRect((i*90)%W,40+(i%4)*50,3,35);
    }
  }
  cloud(W*.15,H*.16,.7); cloud(W*.72,H*.25,.55);
  // distant hills
  ctx.fillStyle="#8dd56d";
  ctx.beginPath(); ctx.moveTo(0,H-85);
  for(let x=0;x<=W;x+=40) ctx.lineTo(x,H-110-Math.sin(x*.025)*28);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
  // cyber robotic gates
  for(const p of skyGates){
    // metallic armored pillars
    ctx.fillStyle="#27313b";
    ctx.fillRect(p.x,0,58,p.top);
    ctx.fillRect(p.x,p.top+gap,58,H-(p.top+gap));

    // steel panels
    ctx.fillStyle="#56616d";
    ctx.fillRect(p.x+8,0,8,p.top);
    ctx.fillRect(p.x+8,p.top+gap,8,H-(p.top+gap));

    // glowing red energy strips
    ctx.fillStyle="#ff3344";
    ctx.fillRect(p.x+38,20,6,Math.min(80,p.top-20));
    ctx.fillRect(p.x+38,p.top+gap+20,6,Math.min(80,H-p.top-gap-40));

    // mechanical top/bottom caps
    ctx.fillStyle="#111827";
    ctx.fillRect(p.x-5,p.top-8,68,10);
    ctx.fillRect(p.x-5,p.top+gap-2,68,10);

    // bolts
    ctx.fillStyle="#9ca3af";
    ctx.beginPath();
    ctx.arc(p.x+48,p.top/2,3,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.x+48,p.top+gap+(H-p.top-gap)/2,3,0,Math.PI*2);
    ctx.fill();
  }
  // ancient sky relics
  for(const r of relics){
    ctx.fillStyle="#d2a23a";
    ctx.beginPath();
    ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#101b2d";
    ctx.fillRect(r.x-8,r.y-8,16,16);
  }

  // enemy birds
  for(const b of enemyBirds){
    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.fillStyle="#444";
    ctx.beginPath();
    ctx.arc(15,14,14,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#666";
    ctx.beginPath();
    ctx.ellipse(8,10,18,8,Math.sin(b.wing)*0.3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#f7c843";
    ctx.beginPath();
    ctx.moveTo(27,13);
    ctx.lineTo(40,18);
    ctx.lineTo(27,22);
    ctx.fill();
    ctx.restore();
  }

  // obstacles
  for(const o of obstacles){
    if(o.type==="rock"){
      ctx.fillStyle="#555";
      ctx.beginPath();
      ctx.moveTo(o.x+5,o.y+50);
      ctx.lineTo(o.x+25,o.y+5);
      ctx.lineTo(o.x+55,o.y+50);
      ctx.closePath();
      ctx.fill();
    }
    if(o.type==="cloud"){
      ctx.fillStyle="#d9e1ea";
      ctx.beginPath();
      ctx.arc(o.x+20,o.y+25,20,0,Math.PI*2);
      ctx.arc(o.x+45,o.y+20,25,0,Math.PI*2);
      ctx.fill();
    }
    if(o.type==="barrier"){
      ctx.fillStyle="#d06b3c";
      ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle="#8f3d22";
      ctx.fillRect(o.x+10,o.y+10,o.w-20,8);
    }
  }

  // ground
  ctx.fillStyle="#d9c45b"; ctx.fillRect(0,H-28,W,28);
  ctx.fillStyle="#73b947";
  for(let x=0;x<W;x+=22) ctx.fillRect(x,H-34,14,6);
  // Robo Dog character (same size replacement)
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.rot);

  // small spinning fan
  ctx.strokeStyle="#62d9ff";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(0,-22,7,0,Math.PI*2);
  ctx.stroke();

  ctx.save();
  ctx.rotate(performance.now()/100);
  ctx.fillStyle="#9fe8ff";
  ctx.beginPath();
  ctx.ellipse(0,-22,12,3,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // compact robotic dog body
  ctx.fillStyle="#4b5563";
  ctx.beginPath();
  ctx.roundRect(-14,-5,28,20,6);
  ctx.fill();

  // head
  ctx.fillStyle="#94a3b8";
  ctx.beginPath();
  ctx.roundRect(-12,-18,24,20,8);
  ctx.fill();

  // ears
  ctx.fillStyle="#64748b";
  ctx.fillRect(-14,-15,5,8);
  ctx.fillRect(9,-15,5,8);

  // glowing eye
  ctx.fillStyle="#22d3ee";
  ctx.beginPath();
  ctx.arc(6,-9,3,0,Math.PI*2);
  ctx.fill();

  // legs
  ctx.fillStyle="#334155";
  ctx.fillRect(-10,12,5,8);
  ctx.fillRect(5,12,5,8);

  // tail
  ctx.strokeStyle="#64748b";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(14,2);
  ctx.lineTo(20,-5);
  ctx.stroke();

  ctx.restore();
  // score
  ctx.fillStyle="#fff"; ctx.font="bold 44px Arial"; ctx.textAlign="center";
  ctx.strokeStyle="#35627a"; ctx.lineWidth=5; ctx.strokeText(score,W/2,65);
  ctx.fillText(score,W/2,65);
  ctx.font="bold 14px Arial"; ctx.fillStyle="#35627a"; ctx.fillText("BEST "+best,W/2,87);
  ctx.font="bold 14px Arial";
  ctx.fillStyle="#35627a";
  ctx.fillText(worldStage===1?"Cyber Sky":worldStage===2?"Machine Storm":"Cyber Night City",W/2,110);
}
function loop(t){
  const dt=Math.min((t-last)/1000||0,0.035); last=t;
  update(dt); draw(); requestAnimationFrame(loop);
}
canvas.addEventListener("pointerdown", e=>{e.preventDefault(); action();});
addEventListener("keydown", e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();action();}});
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
